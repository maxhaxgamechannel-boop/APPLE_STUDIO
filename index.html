<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="APPLE STUDIO — премиальный магазин техники Apple с интерактивными 3D-презентациями устройств." />
    <title>APPLE STUDIO — техника Apple в 3D</title>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было «вспышки» светлого экрана
      (function () {
        try {
          var t = localStorage.getItem('apple-studio-theme')
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          if (t === 'dark') {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <style>html.dark body{background:#000}</style>
    <div id="root"></div>
    <noscript>Для работы APPLE STUDIO включите JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
